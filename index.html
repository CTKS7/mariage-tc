<html lang="fr">

<body>
  <!-- PAGE 1 — Composition issue des éléments Canva du couple.
       Ne pas remplacer les fichiers SVG par des polices ou des dessins reconstitués. -->

    <div class="composition" role="img" aria-label="Initiales C et T manuscrites, entrelacées avec une fleur rose">
      <!-- L'ordre des couches reproduit la création Canva : initiales derrière, fleur devant. -->
      <img class="initiales" src="assets/initiales-ct.svg" alt="" width="400" height="454" draggable="false" fetchpriority="high">

    </div>
  </main>
